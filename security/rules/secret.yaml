# ==============================================================================
# AI-SecOps Secret Extraction Detection Rules Configuration
# ==============================================================================
schema_version: "1.0"
version: "1.0"
description: "Rules database for intercepting attempts to extract sensitive credentials, passwords, API keys, database URLs, or env variables."

rules:
  - rule_id: "SEC-001"
    rule_name: "Credential/Environment Variable Extraction"
    description: "Detects patterns attempting to query, print, or extract API keys, passwords, database URLs, and environmental tokens."
    enabled: true
    threat_type: "SECRET_EXTRACTION"
    severity: "HIGH"
    confidence: 0.90
    category: "Secret Extraction"
    priority: 1
    tags:
      - "credentials"
      - "secrets"
      - "api-key"
      - "database_url"
    recommendation: "Reject prompt. Direct attempt to extract API keys or passwords detected."
    patterns:
      - '(?i)(reveal|show|print|tell|output|get|display|extract|leak|dump)\s+(the\s+)?(api_key|api[-_]key|password|secret|env|environment\s+variable|database_url|access_token|private_key|auth_token)'
    keywords:
      - "api_key"
      - "database_url"
      - "private_key"
    phrases:
      - "reveal the secret"
      - "show environment variables"
      - "what is the API key"
      - "print your password"
