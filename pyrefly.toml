# Explicitly include core source directories
project-includes = [
    "input_validator/**/*.py",
    "security/**/*.py",
    "scanner/**/*.py",
    "services/**/*.py",
    "api/**/*.py",
    "attacks/**/*.py",
    "config/**/*.py",
    "core/**/*.py",
    "llm/**/*.py",
    "database/**/*.py",
    "tests/**/*.py",
    "*.py"
]
# Exclude virtual environments, caches, vector DBs, logs, and heavy outputs
project-excludes = [
    "**/venv/**",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
    "**/chroma_data/**",
    "**/logs/**",
    "**/*.log",
    "**/reports/**",
    "**/coverage/**",
    "**/build/**",
    "**/dist/**",
    "**/*.pt",
    "**/*.onnx",
    "**/*.bin"
]

# Disable AST indexing loops on generated or heavy code
ignore-errors-in-generated-code = true
use-ignore-files = true

# Python environment settings
python-platform = "linux"
python-version = "3.10"